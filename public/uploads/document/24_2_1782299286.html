
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);font-size:14px;color:var(--color-text-primary)}
.app{display:flex;height:100vh;min-height:700px;background:var(--color-background-tertiary)}
.sidebar{width:220px;min-width:220px;background:var(--color-background-primary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;overflow:hidden}
.sidebar-header{padding:16px 14px 12px;border-bottom:0.5px solid var(--color-border-tertiary)}
.logo{font-size:15px;font-weight:500;color:var(--color-text-primary);display:flex;align-items:center;gap:8px}
.logo i{font-size:18px;color:var(--color-text-info)}
.role-toggle{display:flex;gap:4px;margin-top:10px;background:var(--color-background-secondary);border-radius:6px;padding:3px}
.role-btn{flex:1;font-size:11px;padding:4px 6px;border:none;background:transparent;border-radius:4px;cursor:pointer;color:var(--color-text-secondary);font-family:var(--font-sans)}
.role-btn.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500;box-shadow:0 0 0 0.5px var(--color-border-secondary)}
.nav-scroll{overflow-y:auto;flex:1;padding:8px 0}
.nav-section{padding:8px 14px 4px;font-size:10px;font-weight:500;color:var(--color-text-tertiary);letter-spacing:.5px;text-transform:uppercase}
.nav-item{display:flex;align-items:center;gap:8px;padding:7px 14px;cursor:pointer;color:var(--color-text-secondary);font-size:13px;border-radius:0;transition:background .1s}
.nav-item:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.nav-item.active{background:var(--color-background-info);color:var(--color-text-info);font-weight:500}
.nav-item i{font-size:15px;min-width:16px}
.nav-badge{margin-left:auto;background:var(--color-background-danger);color:var(--color-text-danger);font-size:10px;padding:1px 5px;border-radius:10px;font-weight:500}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:50px;background:var(--color-background-primary);border-bottom:0.5px solid var(--color-border-tertiary);display:flex;align-items:center;padding:0 20px;gap:12px}
.topbar-title{font-size:15px;font-weight:500;flex:1}
.topbar-actions{display:flex;align-items:center;gap:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;font-size:13px;cursor:pointer;border:0.5px solid var(--color-border-secondary);background:var(--color-background-primary);color:var(--color-text-primary);font-family:var(--font-sans);transition:background .1s}
.btn:hover{background:var(--color-background-secondary)}
.btn-primary{background:var(--color-text-primary);color:var(--color-background-primary);border-color:transparent}
.btn-primary:hover{opacity:.88}
.btn-sm{padding:4px 8px;font-size:12px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--color-background-info);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--color-text-info)}
.content{flex:1;overflow-y:auto;padding:20px}
.page{display:none}
.page.active{display:block}
.page-header{margin-bottom:20px}
.page-header h1{font-size:18px;font-weight:500;margin-bottom:4px}
.page-header p{font-size:13px;color:var(--color-text-secondary)}
.stats-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px}
.stat-card{background:var(--color-background-secondary);border-radius:8px;padding:14px 16px}
.stat-label{font-size:12px;color:var(--color-text-secondary);margin-bottom:6px}
.stat-value{font-size:22px;font-weight:500}
.stat-sub{font-size:11px;color:var(--color-text-tertiary);margin-top:3px}
.card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:16px}
.card-title{font-size:14px;font-weight:500;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:9px 12px;font-weight:500;font-size:12px;color:var(--color-text-secondary);border-bottom:0.5px solid var(--color-border-tertiary);white-space:nowrap}
td{padding:10px 12px;border-bottom:0.5px solid var(--color-border-tertiary);vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:var(--color-background-secondary)}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:500}
.badge-success{background:var(--color-background-success);color:var(--color-text-success)}
.badge-danger{background:var(--color-background-danger);color:var(--color-text-danger)}
.badge-warning{background:var(--color-background-warning);color:var(--color-text-warning)}
.badge-info{background:var(--color-background-info);color:var(--color-text-info)}
.badge-gray{background:var(--color-background-secondary);color:var(--color-text-secondary)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.form-row.three{grid-template-columns:1fr 1fr 1fr}
.form-group{display:flex;flex-direction:column;gap:5px}
.form-group label{font-size:12px;font-weight:500;color:var(--color-text-secondary)}
.form-group input,.form-group select,.form-group textarea{border:0.5px solid var(--color-border-secondary);border-radius:6px;padding:7px 10px;font-size:13px;font-family:var(--font-sans);background:var(--color-background-primary);color:var(--color-text-primary);outline:none}
.form-group input:focus,.form-group select:focus{border-color:var(--color-border-primary);box-shadow:0 0 0 2px var(--color-background-info)}
.divider{height:0.5px;background:var(--color-border-tertiary);margin:16px 0}
.step-bar{display:flex;gap:0;margin-bottom:24px}
.step{display:flex;align-items:center;gap:8px;flex:1}
.step-num{width:26px;height:26px;border-radius:50%;border:0.5px solid var(--color-border-secondary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;color:var(--color-text-secondary);background:var(--color-background-primary);min-width:26px}
.step.active .step-num{background:var(--color-text-primary);color:var(--color-background-primary);border-color:transparent}
.step.done .step-num{background:var(--color-background-success);color:var(--color-text-success);border-color:transparent}
.step-label{font-size:12px;color:var(--color-text-secondary)}
.step.active .step-label{color:var(--color-text-primary);font-weight:500}
.step-line{flex:1;height:0.5px;background:var(--color-border-tertiary);margin:0 8px}
.kanban{display:flex;gap:12px;overflow-x:auto;padding-bottom:8px}
.kanban-col{min-width:200px;background:var(--color-background-secondary);border-radius:8px;padding:10px}
.kanban-col-header{font-size:12px;font-weight:500;color:var(--color-text-secondary);margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.kanban-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:7px;padding:10px;margin-bottom:8px;font-size:12px;cursor:pointer}
.kanban-card:hover{border-color:var(--color-border-secondary)}
.kanban-card-title{font-weight:500;margin-bottom:5px;font-size:13px}
.kanban-card-meta{color:var(--color-text-secondary);display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.cal-day-header{text-align:center;font-size:11px;font-weight:500;color:var(--color-text-secondary);padding:4px}
.cal-day{border:0.5px solid var(--color-border-tertiary);border-radius:5px;min-height:64px;padding:5px;font-size:11px;cursor:pointer;background:var(--color-background-primary)}
.cal-day:hover{background:var(--color-background-secondary)}
.cal-day.today{border-color:var(--color-border-info);background:var(--color-background-info)}
.cal-day.holiday{background:var(--color-background-warning)}
.cal-day.leave{background:var(--color-background-danger)}
.cal-day-num{font-weight:500;margin-bottom:3px}
.cal-event{font-size:10px;padding:1px 4px;border-radius:3px;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.emp-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.emp-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:14px;text-align:center;cursor:pointer}
.emp-card:hover{border-color:var(--color-border-secondary);background:var(--color-background-secondary)}
.emp-avatar{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:500}
.emp-name{font-size:13px;font-weight:500;margin-bottom:3px}
.emp-role{font-size:11px;color:var(--color-text-secondary)}
.emp-dept{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.tab-bar{display:flex;gap:0;border-bottom:0.5px solid var(--color-border-tertiary);margin-bottom:16px}
.tab{padding:8px 14px;font-size:13px;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent;margin-bottom:-0.5px}
.tab:hover{color:var(--color-text-primary)}
.tab.active{color:var(--color-text-primary);font-weight:500;border-bottom-color:var(--color-text-primary)}
.notice-card{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:10px;padding:14px;margin-bottom:10px}
.notice-header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px}
.notice-title{font-size:14px;font-weight:500}
.notice-body{font-size:13px;color:var(--color-text-secondary);line-height:1.5}
.notice-meta{font-size:11px;color:var(--color-text-tertiary);margin-top:8px;display:flex;gap:12px}
.timeline{position:relative;padding-left:24px}
.timeline::before{content:'';position:absolute;left:7px;top:0;bottom:0;width:0.5px;background:var(--color-border-secondary)}
.tl-item{position:relative;margin-bottom:14px}
.tl-dot{position:absolute;left:-20px;top:3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--color-background-primary);background:var(--color-border-secondary)}
.tl-dot.success{background:var(--color-text-success)}
.tl-dot.info{background:var(--color-text-info)}
.tl-text{font-size:13px}
.tl-time{font-size:11px;color:var(--color-text-tertiary);margin-top:2px}
.progress-bar{height:6px;background:var(--color-background-secondary);border-radius:3px;overflow:hidden;margin-top:6px}
.progress-fill{height:100%;border-radius:3px;background:var(--color-text-info)}
.salary-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:0.5px solid var(--color-border-tertiary);font-size:13px}
.salary-row:last-child{border-bottom:none;font-weight:500;font-size:14px;padding-top:12px}
.tag{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:4px;font-size:11px;background:var(--color-background-secondary);color:var(--color-text-secondary);margin:2px}
.priority-high{color:var(--color-text-danger)}
.priority-med{color:var(--color-text-warning)}
.priority-low{color:var(--color-text-success)}
.quick-links{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:20px}
.quick-link{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:12px 8px;text-align:center;cursor:pointer;font-size:12px;color:var(--color-text-secondary)}
.quick-link:hover{background:var(--color-background-secondary);color:var(--color-text-primary)}
.quick-link i{font-size:20px;display:block;margin-bottom:5px;color:var(--color-text-info)}
.hierarchy-tree{padding:10px 0}
.h-node{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;margin-bottom:6px;background:var(--color-background-secondary)}
.h-indent{padding-left:28px}
.h-indent .h-node{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary)}
.score-circle{width:80px;height:80px;border-radius:50%;border:3px solid var(--color-border-info);display:flex;align-items:center;justify-content:center;flex-direction:column}
.score-val{font-size:20px;font-weight:500;color:var(--color-text-info)}
.score-label{font-size:10px;color:var(--color-text-secondary)}
.chat-bubble{padding:8px 12px;border-radius:8px;margin-bottom:8px;max-width:80%;font-size:13px;line-height:1.5}
.chat-bubble.out{background:var(--color-background-info);color:var(--color-text-info);margin-left:auto}
.chat-bubble.in{background:var(--color-background-secondary);color:var(--color-text-primary)}
.onboard-steps{display:flex;flex-direction:column;gap:10px}
.onboard-step{display:flex;align-items:center;gap:12px;padding:12px;background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:8px}
.onboard-step.done{border-color:var(--color-border-success);background:var(--color-background-success)}
.onboard-icon{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;background:var(--color-background-secondary);min-width:36px}
.onboard-step.done .onboard-icon{background:var(--color-background-success);color:var(--color-text-success)}
</style>

<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo"><i class="ti ti-building-skyscraper" aria-hidden="true"></i>PeopleOS HRM</div>
      <div class="role-toggle">
        <button class="role-btn active" id="role-admin" onclick="setRole('admin')">Admin</button>
        <button class="role-btn" id="role-emp" onclick="setRole('employee')">Employee</button>
      </div>
    </div>
    <div class="nav-scroll" id="nav-container"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <span class="topbar-title" id="topbar-title">Dashboard</span>
      <div class="topbar-actions">
        <button class="btn btn-sm"><i class="ti ti-search" aria-hidden="true"></i></button>
        <button class="btn btn-sm" style="position:relative"><i class="ti ti-bell" aria-hidden="true"></i><span style="position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--color-text-danger);border:1.5px solid var(--color-background-primary)"></span></button>
        <div class="avatar">AK</div>
      </div>
    </div>
    <div class="content" id="content-area"></div>
  </div>
</div>

<script>
const adminNav = [
  {section:'Core HR'},
  {id:'dashboard',label:'Dashboard',icon:'ti-layout-dashboard'},
  {id:'employees',label:'Employee Management',icon:'ti-users'},
  {id:'attendance',label:'Attendance',icon:'ti-clock',badge:'3'},
  {id:'leave',label:'Leave Management',icon:'ti-calendar-off'},
  {id:'payroll',label:'Payroll',icon:'ti-credit-card'},
  {id:'timesheet',label:'Timesheet',icon:'ti-table'},
  {section:'Work'},
  {id:'projects',label:'Project Management',icon:'ti-briefcase'},
  {id:'tasks',label:'Task Management',icon:'ti-checklist'},
  {id:'recruitment',label:'Recruitment',icon:'ti-user-search'},
  {section:'Organisation'},
  {id:'onboarding',label:'Onboarding',icon:'ti-user-plus'},
  {id:'offboarding',label:'Offboarding',icon:'ti-user-minus'},
  {id:'notice',label:'Notice Board',icon:'ti-speakerphone'},
  {id:'events',label:'Events',icon:'ti-calendar-event'},
  {id:'holidays',label:'Holidays',icon:'ti-beach'},
  {section:'Finance & Assets'},
  {id:'expense',label:'Expense Management',icon:'ti-receipt'},
  {id:'assets',label:'Asset Management',icon:'ti-device-laptop'},
  {section:'Performance'},
  {id:'performance',label:'Performance Score',icon:'ti-chart-bar'},
  {id:'eom',label:'Employee of the Month',icon:'ti-trophy'},
  {section:'Policy & Docs'},
  {id:'policy',label:'Company Policy',icon:'ti-file-text'},
  {id:'hierarchy',label:'Company Hierarchy',icon:'ti-sitemap'},
  {section:'Tickets & Support'},
  {id:'tickets',label:'Ticket Management',icon:'ti-ticket',badge:'5'},
  {section:'Real Estate'},
  {id:'units',label:'Units Management',icon:'ti-building'},
  {id:'booking',label:'Booking Management',icon:'ti-calendar-check'},
  {id:'enquiry',label:'Enquiry Management',icon:'ti-message-circle'},
  {id:'loan',label:'Loan Management',icon:'ti-cash'},
  {section:'Archivsta'},
  {id:'sitevisit',label:'Site Visit',icon:'ti-map-pin'},
  {id:'reports',label:'Reports',icon:'ti-chart-pie'},
  {id:'joballoc',label:'Job Allocation',icon:'ti-arrows-transfer-up'},
  {section:'AI'},
  {id:'ai',label:'AI Recommendations',icon:'ti-brain'},
];

const empNav = [
  {section:'My Space'},
  {id:'emp-dashboard',label:'My Dashboard',icon:'ti-layout-dashboard'},
  {id:'emp-attendance',label:'My Attendance',icon:'ti-clock'},
  {id:'emp-leave',label:'My Leaves',icon:'ti-calendar-off'},
  {id:'emp-timesheet',label:'My Timesheet',icon:'ti-table'},
  {id:'emp-payslip',label:'Payslip',icon:'ti-credit-card'},
  {section:'Work'},
  {id:'emp-tasks',label:'My Tasks',icon:'ti-checklist'},
  {id:'emp-projects',label:'My Projects',icon:'ti-briefcase'},
  {id:'emp-expense',label:'Expense Claims',icon:'ti-receipt'},
  {section:'Onboarding'},
  {id:'emp-onboard',label:'Onboarding Journey',icon:'ti-map'},
  {section:'Info'},
  {id:'emp-notice',label:'Notice Board',icon:'ti-speakerphone',badge:'2'},
  {id:'emp-policy',label:'Company Policy',icon:'ti-file-text'},
  {id:'emp-holidays',label:'Holidays',icon:'ti-beach'},
  {id:'emp-hierarchy',label:'Company Hierarchy',icon:'ti-sitemap'},
  {id:'emp-assets',label:'My Assets',icon:'ti-device-laptop'},
  {section:'Performance'},
  {id:'emp-performance',label:'My Performance',icon:'ti-chart-bar'},
  {section:'Support'},
  {id:'emp-tickets',label:'My Tickets',icon:'ti-ticket'},
  {section:'AI'},
  {id:'emp-ai',label:'AI Suggestions',icon:'ti-brain'},
];

let currentRole = 'admin';
let currentPage = 'dashboard';

function setRole(role) {
  currentRole = role;
  document.getElementById('role-admin').className = 'role-btn' + (role==='admin'?' active':'');
  document.getElementById('role-emp').className = 'role-btn' + (role==='employee'?' active':'');
  renderNav();
  const first = (role==='admin'?adminNav:empNav).find(n=>n.id);
  if(first) navigate(first.id);
}

function renderNav() {
  const nav = currentRole==='admin' ? adminNav : empNav;
  const c = document.getElementById('nav-container');
  c.innerHTML = nav.map(item => {
    if(item.section) return `<div class="nav-section">${item.section}</div>`;
    return `<div class="nav-item${item.id===currentPage?' active':''}" onclick="navigate('${item.id}')" id="nav-${item.id}">
      <i class="ti ${item.icon}" aria-hidden="true"></i>${item.label}
      ${item.badge?`<span class="nav-badge">${item.badge}</span>`:''}
    </div>`;
  }).join('');
}

function navigate(id) {
  currentPage = id;
  document.querySelectorAll('.nav-item').forEach(el=>el.classList.remove('active'));
  const el = document.getElementById('nav-'+id);
  if(el) el.classList.add('active');
  const titles = {
    dashboard:'Dashboard',employees:'Employee Management',attendance:'Attendance Management',
    leave:'Leave Management',payroll:'Payroll Management',timesheet:'Timesheet Management',
    projects:'Project Management',tasks:'Task Management',recruitment:'Recruitment Management',
    onboarding:'Onboarding Management',offboarding:'Offboarding Management',notice:'Notice Board',
    events:'Event Management',holidays:'Holiday Management',expense:'Expense Management',
    assets:'Asset Management',performance:'Performance Score',eom:'Employee of the Month',
    policy:'Company Policy',hierarchy:'Company Hierarchy',tickets:'Ticket Management',
    units:'Units Management',booking:'Booking Management',enquiry:'Enquiry Management',
    loan:'Loan Management',sitevisit:'Site Visit Management',reports:'Reports',
    joballoc:'Job Allocation',ai:'AI Recommendations',
    'emp-dashboard':'My Dashboard','emp-attendance':'My Attendance','emp-leave':'My Leaves',
    'emp-timesheet':'My Timesheet','emp-payslip':'Payslip','emp-tasks':'My Tasks',
    'emp-projects':'My Projects','emp-expense':'Expense Claims','emp-onboard':'Onboarding Journey',
    'emp-notice':'Notice Board','emp-policy':'Company Policy','emp-holidays':'Holidays',
    'emp-hierarchy':'Company Hierarchy','emp-assets':'My Assets','emp-performance':'My Performance',
    'emp-tickets':'My Tickets','emp-ai':'AI Suggestions',
  };
  document.getElementById('topbar-title').textContent = titles[id]||id;
  document.getElementById('content-area').innerHTML = getPage(id);
}

function getPage(id) {
  const pages = {
    dashboard: `
      <div class="page active">
        <div class="page-header"><h1>Dashboard</h1><p>Welcome back, Arjun Kumar · ${new Date().toDateString()}</p></div>
        <div class="stats-grid">
          <div class="stat-card"><div class="stat-label">Total Employees</div><div class="stat-value">248</div><div class="stat-sub">↑ 12 this month</div></div>
          <div class="stat-card"><div class="stat-label">Present Today</div><div class="stat-value">201</div><div class="stat-sub">81% attendance rate</div></div>
          <div class="stat-card"><div class="stat-label">Open Tickets</div><div class="stat-value">5</div><div class="stat-sub">2 high priority</div></div>
          <div class="stat-card"><div class="stat-label">Pending Leaves</div><div class="stat-value">8</div><div class="stat-sub">Awaiting approval</div></div>
        </div>
        <div class="quick-links">
          <div class="quick-link" onclick="navigate('employees')"><i class="ti ti-user-plus" aria-hidden="true"></i>Add Employee</div>
          <div class="quick-link" onclick="navigate('attendance')"><i class="ti ti-clock" aria-hidden="true"></i>Attendance</div>
          <div class="quick-link" onclick="navigate('payroll')"><i class="ti ti-credit-card" aria-hidden="true"></i>Run Payroll</div>
          <div class="quick-link" onclick="navigate('recruitment')"><i class="ti ti-user-search" aria-hidden="true"></i>Recruitment</div>
          <div class="quick-link" onclick="navigate('notice')"><i class="ti ti-speakerphone" aria-hidden="true"></i>Post Notice</div>
        </div>
        <div class="grid-2">
          <div class="card">
            <div class="card-title">Recent Activity <span class="badge badge-gray">Today</span></div>
            <div class="timeline">

        <div class="form-group" style="margin-bottom:14px"><label>Upload Documents</label><div style="border:0.5px dashed var(--color-border-secondary);border-radius:8px;padding:20px;text-align:center;color:var(--color-text-secondary);font-size:13px;cursor:pointer"><i class="ti ti-upload" style="font-size:24px;display:block;margin-bottom:6px" aria-hidden="true"></i>Click to upload or drag & drop</div></div>
        <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn">Cancel</button><button class="btn btn-primary" onclick="navigate('projects')">Create Project & Notify Team</button></div>
      </div></div>`,
  };

  const fallback = `<div class="page active"><div class="page-header"><h1>${id.replace(/-/g,' ').replace(/\b\w/g,l=>l.toUpperCase())}</h1><p>Module content</p></div>
    <div class="card"><div style="text-align:center;padding:40px 20px;color:var(--color-text-secondary)"><i class="ti ti-layout-dashboard" style="font-size:40px;display:block;margin-bottom:12px" aria-hidden="true"></i><div style="font-size:15px;font-weight:500;margin-bottom:6px">Module ready</div><div style="font-size:13px">This module follows the same design patterns.</div></div></div></div>`;

  return pages[id] || fallback;
}
